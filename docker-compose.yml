# =============================================================================
# AI-DOC INTERACT — Docker Compose Stack
#
# Three services on a shared bridge network:
#   mlflow-server  (port 5000) — self-hosted MLflow with SQLite backend
#   backend-api    (port 8000) — FastAPI with both HuggingFace models + GPU
#   frontend-ui    (port 8501) — Streamlit UI
#
# GPU note:
#   backend-api requests one NVIDIA GPU via the deploy.resources block.
#   The NVIDIA Container Toolkit must be installed and configured on the host
#   (standard on university GPU servers).  If GPU is unavailable the service
#   falls back to CPU automatically — no code change is needed.
#
# Model cache note:
#   HuggingFace model weights (~1.85 GB total) are stored in ./hf_cache on
#   the host and bind-mounted into the container.  This means the download
#   happens only once even if you run `docker compose down` and restart.
#   On a shared server, point HF_CACHE_HOST_PATH to a directory on /data
#   to avoid filling the home directory.
# =============================================================================

version: "3.9"

volumes:
  # Holds mlflow.db (SQLite experiment database) and the artifact directories
  mlflow_data:
    driver: local

networks:
  ai_doc_net:
    driver: bridge

services:

  # --------------------------------------------------------------------------
  # MLflow tracking server — SQLite backend, no external database required
  # --------------------------------------------------------------------------
  mlflow-server:
    build:
      context: ./mlops/mlflow
      dockerfile: Dockerfile
    container_name: ai_doc_mlflow
    restart: unless-stopped
    environment:
      MLFLOW_BACKEND_STORE_URI: sqlite:////mlflow/mlflow.db
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - ai_doc_net
    healthcheck:
      # Use Python's built-in urllib instead of curl because curl is not
      # installed in the python:3.11-slim base image used by the MLflow service.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 10s
      retries: 8
      # MLflow runs many Alembic migrations on first start; allow 45 s before
      # the first health check so the container is not marked unhealthy
      # prematurely during database initialisation.
      start_period: 45s

  # --------------------------------------------------------------------------
  # Backend API — GPU-accelerated inference with epsilon-greedy A/B routing
  # --------------------------------------------------------------------------
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_doc_backend
    restart: unless-stopped
    depends_on:
      mlflow-server:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-ai_doc_interact}
      MODEL_BART: ${MODEL_BART:-facebook/bart-large-cnn}
      MODEL_FLAN: ${MODEL_FLAN:-google/flan-t5-base}
      MOCK_JWT_TOKEN: ${MOCK_JWT_TOKEN:-mock-jwt-token-for-academic-project}
      EPSILON: ${EPSILON:-0.1}
      # Suppress the MLflow git-executable warning (git is not needed here)
      GIT_PYTHON_REFRESH: quiet
      # HF_HOME is set in the Dockerfile to /hf_cache; this bind mount maps
      # that path to a persistent directory on the host.
      HF_HOME: /hf_cache
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount the host model cache directory so weights persist.
      # Change the left side to a path on /data if your admin recommends it,
      # e.g.:  /data/${USER}/hf_cache:/hf_cache
      - ./hf_cache:/hf_cache
    # GPU access — requests one NVIDIA GPU from the host via Container Toolkit.
    # Remove this entire deploy block if you want to force CPU-only mode.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - ai_doc_net

  # --------------------------------------------------------------------------
  # Streamlit frontend — lightweight; no GPU needed
  # --------------------------------------------------------------------------
  frontend-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_doc_frontend
    restart: unless-stopped
    depends_on:
      - backend-api
    environment:
      BACKEND_URL: http://backend-api:8000
      MOCK_JWT_TOKEN: ${MOCK_JWT_TOKEN:-mock-jwt-token-for-academic-project}
    ports:
      # Host port 9501 matches the SSH tunnel (-L 9501:localhost:9501).
      # The container still runs Streamlit on its internal port 8501.
      - "9501:8501"
    networks:
      - ai_doc_net
