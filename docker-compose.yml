# =============================================================================
# AI-DOC INTERACT — Docker Compose Stack
# Brings up all services, infrastructure, and MLOps tooling locally.
# GPU sharing is handled through NVIDIA Container Toolkit device reservations
# on the inference workers (summarizer, question_gen).
# =============================================================================

version: "3.9"

# ---------------------------------------------------------------------------
# Named volumes shared across services
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  mlflow_artifacts:
    driver: local
  redis_data:
    driver: local
  grafana_data:
    driver: local

# ---------------------------------------------------------------------------
# Custom bridge network so services resolve each other by service name
# ---------------------------------------------------------------------------
networks:
  ai_doc_net:
    driver: bridge

services:

  # --------------------------------------------------------------------------
  # PostgreSQL — primary relational store
  # Initialised with docker/postgres/init.sql on first boot
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ai_doc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aidoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aidoc_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aidoc}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aidoc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_doc_net

  # --------------------------------------------------------------------------
  # Redis — result cache (TTL 10 min) and Celery / rq job queue
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ai_doc_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_doc_net

  # --------------------------------------------------------------------------
  # MLflow tracking server
  # Artifacts are stored in a named volume; metadata in PostgreSQL.
  # --------------------------------------------------------------------------
  mlflow:
    build:
      context: ./mlops/mlflow
      dockerfile: Dockerfile
    container_name: ai_doc_mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-aidoc}:${POSTGRES_PASSWORD:-aidoc_secret}@postgres:5432/${POSTGRES_DB:-aidoc}
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    networks:
      - ai_doc_net

  # --------------------------------------------------------------------------
  # Auth service — JWT issuance and user management
  # --------------------------------------------------------------------------
  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: ai_doc_auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aidoc}:${POSTGRES_PASSWORD:-aidoc_secret}@postgres:5432/${POSTGRES_DB:-aidoc}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 60
    ports:
      - "8001:8001"
    networks:
      - ai_doc_net

  # --------------------------------------------------------------------------
  # Parser service — document ingestion and chunking
  # --------------------------------------------------------------------------
  parser:
    build:
      context: ./services/parser
      dockerfile: Dockerfile
    container_name: ai_doc_parser
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/1
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    ports:
      - "8002:8002"
    networks:
      - ai_doc_net

  # --------------------------------------------------------------------------
  # Summarizer inference worker — GPU-enabled
  # --------------------------------------------------------------------------
  summarizer:
    build:
      context: ./services/summarizer
      dockerfile: Dockerfile
    container_name: ai_doc_summarizer
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/2
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: ${SUMMARIZER_MODEL:-facebook/bart-large-cnn}
    ports:
      - "8003:8003"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - ai_doc_net

  # --------------------------------------------------------------------------
  # Question-generation inference worker — GPU-enabled
  # --------------------------------------------------------------------------
  question_gen:
    build:
      context: ./services/question_gen
      dockerfile: Dockerfile
    container_name: ai_doc_question_gen
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/3
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: ${QGEN_MODEL:-valhalla/t5-base-qg-hl}
    ports:
      - "8004:8004"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - ai_doc_net

  # --------------------------------------------------------------------------
  # API Gateway — reverse proxy, A/B routing, and feedback ingestion
  # --------------------------------------------------------------------------
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: ai_doc_gateway
    restart: unless-stopped
    depends_on:
      - auth
      - parser
      - summarizer
      - question_gen
    environment:
      AUTH_SERVICE_URL: http://auth:8001
      PARSER_SERVICE_URL: http://parser:8002
      SUMMARIZER_SERVICE_URL: http://summarizer:8003
      QUESTION_GEN_SERVICE_URL: http://question_gen:8004
      REDIS_URL: redis://redis:6379/4
      DATABASE_URL: postgresql://${POSTGRES_USER:-aidoc}:${POSTGRES_PASSWORD:-aidoc_secret}@postgres:5432/${POSTGRES_DB:-aidoc}
      # A/B traffic split: percentage routed to variant B (0-100)
      AB_VARIANT_B_PERCENT: ${AB_VARIANT_B_PERCENT:-20}
    ports:
      - "8000:8000"
    networks:
      - ai_doc_net

  # --------------------------------------------------------------------------
  # Prometheus — metrics scraping
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ai_doc_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./mlops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - ai_doc_net

  # --------------------------------------------------------------------------
  # Grafana — dashboards
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: ai_doc_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./mlops/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./mlops/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - ai_doc_net

  # --------------------------------------------------------------------------
  # Frontend — Next.js 14 App Router
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_doc_frontend
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:8000
      # Internal URL used during SSR
      GATEWAY_INTERNAL_URL: http://gateway:8000
    ports:
      - "3000:3000"
    networks:
      - ai_doc_net
