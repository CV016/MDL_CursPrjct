# =============================================================================
# AI-DOC INTERACT — GitHub Actions CI/CD pipeline
#
# Pipeline stages:
#   lint       — ruff + mypy across all Python services
#   test-auth  — pytest unit tests for the auth service
#   test-parser— pytest integration tests for the parser service
#   build      — Docker build for every service (parallel matrix)
#   drift      — Generate an Evidently drift report (scheduled, main branch only)
#
# Secrets required (configure in GitHub repo Settings -> Secrets):
#   DOCKER_USERNAME   — Docker Hub / registry username
#   DOCKER_PASSWORD   — Docker Hub / registry password or token
#   DATABASE_URL      — PostgreSQL DSN for the drift reporting job
#   MLFLOW_TRACKING_URI — MLflow server URL for the drift job
# =============================================================================

name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  # Run drift monitoring every morning at 06:00 UTC on the main branch
  schedule:
    - cron: "0 6 * * *"

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ai-doc-interact

# ---------------------------------------------------------------------------
# Permissions
# ---------------------------------------------------------------------------
permissions:
  contents: read
  packages: write  # Required to push images to GitHub Container Registry

jobs:

  # --------------------------------------------------------------------------
  # Lint — ruff and mypy
  # --------------------------------------------------------------------------
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install lint dependencies
        run: |
          pip install ruff==0.4.4 mypy==1.10.0 \
            pydantic==2.7.1 \
            fastapi==0.111.0 \
            types-redis \
            types-passlib \
            PyJWT==2.8.0

      - name: Run ruff lint
        run: ruff check services/ shared/ mlops/
        continue-on-error: false

      - name: Run ruff format check
        run: ruff format --check services/ shared/ mlops/

      - name: Run mypy
        run: mypy --config-file pyproject.toml services/ shared/

  # --------------------------------------------------------------------------
  # Auth service tests
  # --------------------------------------------------------------------------
  test-auth:
    name: Tests — Auth Service
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install auth dependencies
        run: pip install -r services/auth/requirements.txt pytest pytest-asyncio

      - name: Run auth unit tests
        env:
          DATABASE_URL: "postgresql://test:test@localhost/test"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET: "ci-test-secret-key"
          JWT_ALGORITHM: "HS256"
          JWT_EXPIRE_MINUTES: "60"
        run: pytest services/auth/tests/ -v --tb=short

  # --------------------------------------------------------------------------
  # Parser service tests
  # --------------------------------------------------------------------------
  test-parser:
    name: Tests — Parser Service
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install parser dependencies
        run: pip install -r services/parser/requirements.txt pytest

      - name: Run parser integration tests
        env:
          TOKENIZER_NAME: "bert-base-uncased"
        run: pytest services/parser/tests/ -v --tb=short

  # --------------------------------------------------------------------------
  # Docker build matrix — build all service images in parallel
  # --------------------------------------------------------------------------
  build:
    name: Docker Build — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test-auth, test-parser]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            context: services/gateway
            port: 8000
          - service: auth
            context: services/auth
            port: 8001
          - service: parser
            context: services/parser
            port: 8002
          - service: summarizer
            context: services/summarizer
            port: 8003
          - service: question_gen
            context: services/question_gen
            port: 8004
          - service: frontend
            context: frontend
            port: 3000
          - service: mlflow
            context: mlops/mlflow
            port: 5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build (and push on non-PR)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use GitHub Actions cache to speed up repeat builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # Drift monitoring — runs on a schedule against the main branch only
  # --------------------------------------------------------------------------
  drift:
    name: Data Drift Report
    runs-on: ubuntu-latest
    # Only run on the scheduled trigger against main
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install drift dependencies
        run: pip install -r mlops/drift/requirements.txt

      - name: Generate drift report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python mlops/drift/drift_report.py \
            --days-reference 30 \
            --days-current 1 \
            --output-dir mlops/drift/reports \
            --upload-mlflow

      - name: Upload drift report artifact
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-${{ github.run_id }}
          path: mlops/drift/reports/
          retention-days: 30
