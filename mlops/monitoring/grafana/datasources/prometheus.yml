# =============================================================================
# Grafana provisioned datasource — Prometheus
# This file is mounted at /etc/grafana/provisioning/datasources/ and
# configures the Prometheus datasource automatically on first boot.
# =============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      # Grafana will query Prometheus using the remote_read endpoint for
      # more efficient range queries on large datasets
      prometheusType: Prometheus
