# =============================================================================
# Grafana dashboard provisioning configuration
# Points Grafana at the directory containing dashboard JSON files.
# =============================================================================

apiVersion: 1

providers:
  - name: AI-DOC INTERACT Dashboards
    orgId: 1
    folder: "AI-DOC INTERACT"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 60
    options:
      # All JSON files in this directory are loaded as dashboards
      path: /etc/grafana/provisioning/dashboards
