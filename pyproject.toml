# =============================================================================
# AI-DOC INTERACT — root pyproject.toml
#
# Contains configuration for the tools used in the project:
#   flake8  — syntax and style linting (run via GitHub Actions CI)
#   pytest  — test runner configuration
# =============================================================================

# ---------------------------------------------------------------------------
# flake8 — linting configuration
# flake8 reads this section when invoked with --toml-config or via setup.cfg;
# the canonical way to configure flake8 in pyproject.toml requires the
# Flake8-pyproject plugin. The CI workflow passes flags directly on the
# command line so this section is provided for local development convenience.
# ---------------------------------------------------------------------------
[tool.flake8]
max-line-length = 120
extend-ignore = [
    "W503",   # line break before binary operator (Black-compatible style)
    "E203",   # whitespace before ':' (Black-compatible style)
]
exclude = [
    "__pycache__",
    ".git",
    ".venv",
    "*.egg-info",
]
per-file-ignores = [
    # Test files may use longer lines in assertion messages
    "backend/tests/*.py:E501",
]

# ---------------------------------------------------------------------------
# pytest — test runner configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
# Default test collection paths
testpaths = ["backend/tests"]

# Show individual test names even without -v flag
addopts = "-v --tb=short"

# Treat DeprecationWarnings from third-party libraries as non-fatal
filterwarnings = [
    "ignore::DeprecationWarning",
]
